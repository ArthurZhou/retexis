[workspace]
resolver = "2"
members = [
    "crates/retexis-core",
    "crates/retexis-crypto",
    "crates/retexis-discovery",
    "crates/retexis-link-tcp",
    "crates/retexis-link-udp",
    "crates/retexis-data",
    "crates/retexis-routing",
    "crates/retexis-app",
    "crates/retexis-node",
    "crates/retexis-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["retexis contributors"]

[workspace.dependencies]
retexis-core = { path = "crates/retexis-core" }
retexis-crypto = { path = "crates/retexis-crypto" }
retexis-discovery = { path = "crates/retexis-discovery" }
retexis-link-tcp = { path = "crates/retexis-link-tcp" }
retexis-link-udp = { path = "crates/retexis-link-udp" }
retexis-data = { path = "crates/retexis-data" }
retexis-routing = { path = "crates/retexis-routing" }
retexis-app = { path = "crates/retexis-app" }
retexis-sim = { path = "crates/retexis-sim" }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
